name: Build Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: xcodebuild -project HyperCloudGaming.xcodeproj -scheme HyperCloudGaming -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HyperCloudGaming.app Payload/
          zip -r HyperCloudGaming.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HyperCloudGaming-ipa
          path: HyperCloudGaming.ipa